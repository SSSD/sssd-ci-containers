---
- hosts: services
  gather_facts: yes
  roles:
  - facts
  - firewall
  - no_nscd

- hosts: ldap
  gather_facts: no
  roles:
  - ldap

- hosts: samba
  gather_facts: no
  roles:
  - samba

- hosts: ipa
  gather_facts: no
  roles:
  - ipa
  - { role: ipasmartcard, when: "ansible_facts['os_family'] == 'RedHat' and virt_smartcard" }

# The kdc role must run before the client role, enroll_KDC.yml needs the
# Kerberos database to request the client host keytab.
- hosts: kdc
  gather_facts: no
  roles:
  - kdc

- hosts: client
  gather_facts: no
  roles:
  - client
  - { role: virtsmartcard, when: "ansible_facts['os_family'] == 'RedHat' and virt_smartcard" }
  - { role: ipasmartcard, when: "ansible_facts['os_family'] == 'RedHat' and virt_smartcard" }
  - { role: selenium, when: "ansible_facts['os_family'] == 'RedHat' and selenium_support" }
  - { role: passkey, when: "ansible_facts['os_family'] == 'RedHat' and passkey_support" }
  - { role: gdm, when: "ansible_facts['os_family'] == 'RedHat' and gdm_support" }

- hosts: nfs
  gather_facts: no
  roles:
  - nfs

- hosts: keycloak
  gather_facts: no
  roles:
  - keycloak

- hosts: services
  gather_facts: no
  roles:
  - ssh_server

- hosts: services
  gather_facts: no
  roles:
  - role: cleanup
    when: skip_cleanup is undefined or not skip_cleanup
