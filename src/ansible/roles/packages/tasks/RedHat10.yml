- name: Install EPEL repository
  dnf:
    state: present
    name: 'https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts["distribution_major_version"] }}.noarch.rpm'
    disable_gpg_check: yes
  when: extended_packageset

- name: Install EPEL repository (for python3-koji when passkey testing)
  dnf:
    state: present
    name: 'https://dl.fedoraproject.org/pub/epel/epel-release-latest-{{ ansible_facts["distribution_major_version"] }}.noarch.rpm'
    disable_gpg_check: yes
  register: epel_passkey
  # Tolerate failure on STIG-hardened systems where packages may be unsigned
  failed_when:
    - epel_passkey is failed
    - not stig_enabled | default(false) | bool
  when:
    - passkey_support
    - "'base_client' in group_names or 'client' in group_names"

- name: Install packages for usbip needed for virtual passkey testing
  dnf:
    state: present
    name:
    - gcc
    - make
    - automake
    - autoconf
    - systemd-devel
    - libtool
    - python3-koji
  register: usbip_deps
  # Tolerate failure on STIG-hardened systems where packages may be unsigned
  failed_when:
    - usbip_deps is failed
    - not stig_enabled | default(false) | bool
  when:
    - passkey_support
    - "'base_client' in group_names or 'client' in group_names"

- name: 'Packages are the same as in Fedora'
  include_tasks: 'Fedora.yml'
