- name: Allow access from our network
  win_firewall_rule:
    name: Allow access from our network
    direction: in
    action: allow
    enabled: yes
    state: present
  when: open_firewall

- name: Set the default SSH shell to PowerShell
  win_regedit:
    path: HKLM:\SOFTWARE\OpenSSH
    name: DefaultShell
    data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
    type: string
    state: present

- name: Ensure .NET Framework 4.8 is installed on Windows Server 2019
  ansible.windows.win_package:
    path: https://go.microsoft.com/fwlink/?linkid=2088631
    product_id: '{92D58119-001C-32B0-B22E-293F08411DD0}'
    arguments: /q /norestart
    state: present
  when:
    - "'2019' in ansible_facts['distribution']"
    - "ansible_facts['os_family'] == 'Windows'"

- name: Detect cygwin
  win_stat:
    path: 'C:\cygwin64\etc'
  register: cygwin

- name: Configure shell for cygwin
  win_lineinfile:
    path: 'C:\cygwin64\etc\nsswitch.conf'
    line: "db_shell: /cygdrive/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe"
  when: cygwin.stat.exists
  register: configured_cygwin

- name: Reboot machine to apply changes in cygwin config
  win_reboot:
  when: configured_cygwin.changed and skip_addc_install

- name: Prepare AD facts
  set_fact:
    ad_domain: "{{ '.'.join(inventory_hostname.split('.')[1:]) }}"
    ad_netbios: "{{ inventory_hostname.split('.')[1].upper() }}"
    ad_suffix: "{{ inventory_hostname.split('.')[1:] | map('regex_replace', '^(.*)$', 'dc=\\1') | join(',') }}"
    ad_password: "{{ service.ad.safe_password }}"

- name: Debug AD facts
  debug:
    msg: 'AD domain: "{{ ad_domain }}", AD netbios: "{{ ad_netbios }}", AD suffix: "{{ ad_suffix }}"'

- name: 'Install AD server'
  include_tasks: 'install.yml'
  when: not skip_addc_install

- name: Install management tools
  win_feature:
    name:
    - RSAT-AD-Tools
    include_sub_features: yes
    include_management_tools: yes

- name: Copy PSIni module to remote
  ansible.windows.win_copy:
    src: psini-3.1.4.nupkg
    dest: 'C:\Windows\Temp\psini-3.1.4.zip'

- name: Install PSIni module from vendored package
  win_shell: |
    $modPath = 'C:\Program Files\WindowsPowerShell\Modules\PSIni\3.1.4'
    New-Item -ItemType Directory -Path $modPath -Force | Out-Null
    Expand-Archive -Path 'C:\Windows\Temp\psini-3.1.4.zip' -DestinationPath $modPath -Force
    Remove-Item -Path "$modPath\_rels", "$modPath\package",
      "$modPath\[Content_Types].xml", "$modPath\PSIni.nuspec" `
      -Recurse -Force -ErrorAction SilentlyContinue
    Remove-Item 'C:\Windows\Temp\psini-3.1.4.zip' -Force
  args:
    creates: 'C:\Program Files\WindowsPowerShell\Modules\PSIni\3.1.4\PSIni.psd1'

- name: Create BIND tools directory
  ansible.windows.win_file:
    path: 'C:\BIND'
    state: directory

- name: Copy BIND tools zip to remote
  ansible.windows.win_copy:
    src: bind9-toolsonly-9.16.28-x64.zip
    dest: 'C:\Windows\Temp\bind9-toolsonly.zip'

- name: Extract BIND tools
  win_shell: |
    Expand-Archive -Path 'C:\Windows\Temp\bind9-toolsonly.zip' `
      -DestinationPath 'C:\BIND' -Force
    Remove-Item 'C:\Windows\Temp\bind9-toolsonly.zip'
  args:
    creates: 'C:\BIND\dig.exe'

- name: Add BIND tools to system PATH
  ansible.windows.win_path:
    elements: 'C:\BIND'
    scope: machine
    state: present

- name: Make sure Active Directory Web Services is running
  win_service:
    name: adws
    start_mode: auto
    state: started

- name: 'Add sudo schema and possibly other'
  include_tasks: 'schema.yml'
  when:
    # Schema NC is forest-wide (under the root domain DN). Child/tree DCs share
    # it; installing with their domain suffix yields CN=Schema,...,DC=child,...
    # which does not exist (ldifde NO_OBJECT).
    - not skip_schema
    - meta_parent_domain is not defined

- name: Set Password Never Expires for system users
  win_shell: |
    Import-Module ActiveDirectory

    $user = Get-ADUser -Server {{ ad_domain }} -Identity {{ item }}   \
      -Properties PasswordNeverExpires
    if ($user.PasswordNeverExpires -eq $true) {
      exit 255
    }

    Set-ADUser -Server {{ ad_domain }} -Identity {{ item }}           \
      -PasswordNeverExpires $true
  register: result
  failed_when: "result.rc != 255 and result.rc != 0"
  changed_when: "result.rc == 0"
  until: "result.rc == 255 or result.rc == 0"
  # The AD is sometimes not ready to proccess requests so we retry
  # to make it stable.
  retries: 5
  delay: 60
  with_items:
  - "{{ ad_permanent_users }}"

- name: 'Configure DNS on vagrant AD'
  include_tasks: 'dns.yml'
  when: not skip_dns

- name: Install Certificate Templates for Smart Card
  include_tasks: 'cert_tmpl.yml'
  when: meta_domain_level | default('top') == 'top'
