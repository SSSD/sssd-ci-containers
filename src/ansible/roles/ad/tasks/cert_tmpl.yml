# Certificate Template setup generated with Gemini assistance


- name: Setup Certificate Templates for Smart Card Authentication
  block:

  - name: Install ADCS Certificate Authority role
    win_feature:
      name: ADCS-Cert-Authority
      include_management_tools: yes
      state: present

  - name: Query CA Configuration SetupStatus
    ansible.windows.win_reg_stat:
      path: HKLM:\SYSTEM\CurrentControlSet\Services\CertSvc\Configuration
      name: SetupStatus
    register: ca_setup_reg

  - name: Debug current SetupStatus value
    ansible.builtin.debug:
      var: ca_setup_reg
    when: ca_setup_reg.exists

  - name: Configure ADCS as Enterprise Root CA
    win_shell: |
      Install-AdcsCertificationAuthority -CAType EnterpriseRootCA `
        -CACommonName "ad-RootCA" `
        -KeyLength 2048 `
        -HashAlgorithmName SHA256 `
        -ValidityPeriod Years `
        -OverwriteExistingCAinDS `
        -OverwriteExistingDatabase `
        -ValidityPeriodUnits 10 -Force
    register: adcs_config
    args:
      executable: powershell.exe
    when: not ca_setup_reg.exists or (ca_setup_reg.value | default(0) | int) < 24577

  - name: Create temporary directory
    win_file:
      path: "{{ temp_dir }}"
      state: directory

  - name: Copy LDIF template files to server
    win_copy:
      #src: "{{ item.file }}"
      content: "{{ lookup('template', 'templates/' ~ item.file ~ '.j2') }}"
      dest: "{{ temp_dir }}\\{{ item.file }}"
    loop: "{{ templates }}"

  - name: Import Certificate Templates via LDIFDE
    win_shell: "ldifde -i -f .\\{{ item.file }}"
    args:
      chdir: "{{ temp_dir }}"
    loop: "{{ templates }}"
    ignore_errors: yes

  - name: Bootstrap NuGet package provider
    # PowerShellGet's Install-Module requires the NuGet provider. This used to be a side
    # effect of the old "Install powershell modules" task in main.yml, which bootstrapped
    # NuGet while installing PSIni from PSGallery. That task was replaced with a vendored,
    # offline PSIni install (no NuGet/PSGallery dependency), so bootstrap NuGet here
    # explicitly for this task's sake instead.
    win_shell: |
      [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
      Get-PackageProvider NuGet -ForceBootstrap
    args:
      executable: PowerShell.exe

  - name: Update PowerShellGet module
    win_shell: |
      Install-Module -Name PowerShellGet -Force -SkipPublisherCheck -AllowClobber
    args:
      executable: PowerShell.exe

  - name: Apply Security ACLs to Templates
    win_shell: |
      $configNC = (Get-ADRootDSE).configurationNamingContext
      $templateDN = "CN={{ item.name }},CN=Certificate Templates,CN=Public Key Services,CN=Services,$configNC"

      $sidUsers = (New-Object System.Security.Principal.NTAccount("Domain Users")).Translate([System.Security.Principal.SecurityIdentifier])
      $sidComps = (New-Object System.Security.Principal.NTAccount("Domain Computers")).Translate([System.Security.Principal.SecurityIdentifier])

      $acl = Get-Acl -Path "AD:$templateDN"

      # Define specific rights for Read and Enroll
      $rights = [System.DirectoryServices.ActiveDirectoryRights]::ReadProperty -bor [System.DirectoryServices.ActiveDirectoryRights]::ExtendedRight

      $type = [System.Security.AccessControl.AccessControlType]::Allow
      $inherit = [System.Security.AccessControl.InheritanceFlags]::ContainerInherit
      $guid = [Guid]::Empty

      # Enrollment Extended Right GUID: 0e10c968-78fb-11d2-90d4-00c04f79dc55
      $enrollGuid = [Guid]"0e10c968-78fb-11d2-90d4-00c04f79dc55"

      # Create rules using the Enrollment Extended Right GUID
      $uRule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($sidUsers, $rights, $type, $enrollGuid, $inherit, $guid)
      $cRule = New-Object System.DirectoryServices.ActiveDirectoryAccessRule($sidComps, $rights, $type, $enrollGuid, $inherit, $guid)

      $acl.AddAccessRule($uRule)
      $acl.AddAccessRule($cRule)

      Set-Acl -Path "AD:$templateDN" -AclObject $acl
    loop: "{{ templates }}"

  - name: Publish Templates
    win_shell: "Add-CATemplate -Name {{ item.name }} -Force"
    loop: "{{ templates }}"
    register: publish_result
    until: publish_result is succeeded
    retries: 60
    delay: 15

  - name: Copy OpenSSL installer to remote
    ansible.windows.win_copy:
      src: Win64OpenSSL_Light-3_3_7.msi
      dest: 'C:\Windows\Temp\Win64OpenSSL_Light-3_3_7.msi'

  - name: Install OpenSSL from vendored MSI
    ansible.windows.win_package:
      path: 'C:\Windows\Temp\Win64OpenSSL_Light-3_3_7.msi'
      product_id: '{DDB9F7E3-FB58-456E-B753-546700BDACEB}'
      state: present
      arguments: /qn
    register: openssl_install

  - name: Remove OpenSSL installer
    ansible.windows.win_file:
      path: 'C:\Windows\Temp\Win64OpenSSL_Light-3_3_7.msi'
      state: absent
    when: openssl_install.changed

  - name: Add OpenSSL directory to machine PATH
    ansible.windows.win_path:
      elements: 'C:\Program Files\OpenSSL-Win64\bin'
      scope: machine
      state: present

  - name: Reboot machine to apply changes in path for ssh
    win_reboot:

  become: yes
  become_method: runas
  become_user: Administrator
