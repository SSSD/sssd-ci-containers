- name: Install Active Directory Services
  win_feature:
    name: '{{ item }}'
    include_management_tools: yes
    include_sub_features: yes
    state: present
  with_items:
  - AD-Domain-Services
  - DNS

- name: 'Create new AD forest {{ ad_domain }}'
  win_shell: |
    Import-Module ADDSDeployment

    Install-ADDSForest                                                        \
      -DomainName "{{ ad_domain }}"                                           \
      -CreateDnsDelegation:$false                                             \
      -ForestMode "WinThreshold"                                              \
      -DomainMode "WinThreshold"                                              \
      -Force:$true                                                            \
      -InstallDns:$true                                                       \
      -NoRebootOnCompletion:$true                                             \
      -SafeModeAdministratorPassword                                          \
        (ConvertTo-SecureString '{{ ad_password }}' -AsPlainText -Force)
  register: installation
  args:
    creates: 'C:\Windows\NTDS'

- name: Reboot machine
  win_reboot:
  when: installation.changed

- name: Enable AES Kerberos encryption for FIPS/STIG client compatibility
  win_shell: |
    Import-Module ActiveDirectory

    # Enable AES 256 encryption support on domain controllers
    # 0x18 = AES128 (0x08) + AES256 (0x10)
    Get-ADComputer -Filter {PrimaryGroupID -eq 516} -Properties msDS-SupportedEncryptionTypes |
      Set-ADComputer -Replace @{'msDS-SupportedEncryptionTypes' = 24}

    # Configure supported Kerberos encryption types via registry
    New-Item -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters" -Force
    Set-ItemProperty -Path "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\Kerberos\Parameters" `
      -Name "SupportedEncryptionTypes" -Value 24 -Type DWord -Force

    gpupdate /force
  register: aes_config
  until: aes_config.rc == 0
  retries: 3
  delay: 30

- name: Install AD Certificate Services
  win_feature:
    name: AD-Certificate
    include_management_tools: yes
    include_sub_features: yes
    state: present
  register: adcs_feature

- name: Configure Enterprise Root CA
  win_shell: |
    Import-Module ADCSDeployment
    Install-AdcsCertificationAuthority \
      -CAType EnterpriseRootCA \
      -CryptoProviderName "RSA#Microsoft Software Key Storage Provider" \
      -KeyLength 2048 \
      -HashAlgorithmName SHA256 \
      -Force
  args:
    creates: 'C:\Windows\System32\CertSrv'

- name: Install AD CS Web Enrollment
  win_feature:
    name: ADCS-Web-Enrollment
    include_management_tools: yes
    state: present

- name: Enable LDAPS (Force Certificate Enrollment)
  win_shell: |
    gpupdate /force

    certutil -pulse
  changed_when: true

- name: Verify LDAPS (Port 636) is Open
  win_wait_for:
    port: 636
    delay: 10
    timeout: 120

- name: Export Root CA Certificate (PEM Format)
  win_shell: |
    $cert = Get-ChildItem Cert:\LocalMachine\Root | Sort-Object NotBefore -Descending | Select-Object -First 1

    if ($cert) {
        $pem = "-----BEGIN CERTIFICATE-----`r`n" + [Convert]::ToBase64String($cert.RawData, "InsertLineBreaks") + "`r`n-----END CERTIFICATE-----"
        $pem | Out-File -FilePath "C:\Windows\Temp\ad-root-ca.crt" -Encoding ascii
    }
  args:
    creates: 'C:\Windows\Temp\ad-root-ca.crt'

- name: Fetch CA Certificate to Ansible Controller
  fetch:
    src: 'C:\Windows\Temp\ad-root-ca.crt'
    dest: './files/'
    flat: yes
