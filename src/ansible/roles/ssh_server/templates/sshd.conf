HostKey /var/data/ssh-keys/hosts/{{ inventory_hostname }}.ecdsa_key
HostKey /var/data/ssh-keys/hosts/{{ inventory_hostname }}.ed25519_key
HostKey /var/data/ssh-keys/hosts/{{ inventory_hostname }}.rsa_key

PermitRootLogin yes

# Test suites deliberately fail SSH auth over loopback in quick succession
# (e.g. access-control deny tests). OpenSSH's default PerSourcePenalties then
# refuses subsequent connections from the same source, breaking unrelated
# tests.
PerSourcePenalties no
